version: 2
models:
  - name: stg_customers
    columns:
      - name: customer_id
        tests: [unique, not_null]
      - name: country_code
        tests:
          - accepted_values:
              values: ['DE', 'NL', 'FR', 'US', 'NO', 'CH', 'IT']
  - name: stg_products
    columns:
      - name: product_id
        tests: [unique, not_null]
  - name: stg_sites
    columns:
      - name: site_id
        tests: [unique, not_null]
  - name: stg_sales_order_lines
    columns:
      - name: order_line_id
        tests: [unique, not_null]
      - name: customer_id
        tests:
          - relationships: {to: ref('stg_customers'), field: customer_id}
      - name: product_id
        tests:
          - relationships: {to: ref('stg_products'), field: product_id}
  - name: stg_production_batches
    columns:
      - name: batch_id
        tests: [unique, not_null]
      - name: qc_status
        tests:
          - accepted_values: {values: ['RELEASED', 'REJECTED']}
